<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Schedule Widget for Notion</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts - Inter & Titillium Web for F1 vibe -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Titillium+Web:ital,wght@0,600;0,700;1,700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            f1red: '#E10600',
            f1dark: '#191919',
            f1card: '#222222',
            f1border: '#2A2A2A',
            f1gray: '#8E8E93',
            f1light: '#2F2F2F'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            f1: ['Titillium Web', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    /* Custom scrollbar for Notion embedding */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: #E10600;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ff1a14;
    }
    
    .glow-f1 {
      box-shadow: 0 0 15px rgba(225, 6, 0, 0.35);
    }
    .text-f1-italic {
      font-style: italic;
      font-family: 'Titillium Web', sans-serif;
    }
  </style>
</head>
<body class="bg-f1dark text-gray-100 font-sans antialiased p-2 sm:p-4 min-h-screen select-none">

  <!-- Main Container -->
  <div class="max-w-md md:max-w-2xl mx-auto bg-f1dark rounded-xl border border-f1border overflow-hidden shadow-2xl">
    
    <!-- Header Bar -->
    <div class="bg-f1card p-3 sm:p-4 border-b border-f1border flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="bg-f1red text-white text-xs font-bold px-2 py-1 rounded tracking-wider font-f1 uppercase">F1</span>
        <h1 class="text-base sm:text-lg font-bold font-f1 tracking-wide uppercase text-white flex items-center gap-1.5">
          Schedule <span id="season-year" class="text-f1red font-normal">2026</span>
        </h1>
      </div>

      <div class="flex items-center space-x-2">
        <!-- Timezone Selector -->
        <select id="tz-select" class="bg-f1dark text-xs border border-f1border text-gray-300 rounded px-2 py-1 focus:outline-none focus:border-f1red cursor-pointer">
          <option value="local">My Time</option>
          <option value="track">Track Time</option>
          <option value="utc">UTC</option>
        </select>

        <!-- Refresh Button -->
        <button id="refresh-btn" class="p-1.5 text-gray-400 hover:text-white rounded hover:bg-f1light transition-colors" title="Refresh Schedule">
          <i class="fa-solid fa-arrows-rotate text-xs"></i>
        </button>
      </div>
    </div>

    <!-- Hero Section: Next / Current Race -->
    <div id="hero-card" class="p-4 sm:p-5 bg-gradient-to-b from-f1card to-f1dark border-b border-f1border relative overflow-hidden">
      <div class="absolute -right-8 -top-8 opacity-5 text-f1red font-f1 text-9xl font-extrabold italic pointer-events-none">
        NEXT
      </div>

      <div class="relative z-10">
        <div class="flex items-center justify-between mb-2">
          <span id="hero-badge" class="inline-flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-f1red bg-f1red/10 border border-f1red/30 px-2.5 py-0.5 rounded-full">
            <span class="w-2 h-2 rounded-full bg-f1red animate-ping"></span>
            NEXT RACE • ROUND <span id="hero-round">--</span>
          </span>
          <span id="hero-country-code" class="text-xs text-f1gray font-mono uppercase">---</span>
        </div>

        <h2 id="hero-title" class="text-xl sm:text-2xl font-bold font-f1 tracking-wide text-white mb-1">
          Loading Grand Prix...
        </h2>
        <p id="hero-circuit" class="text-xs text-f1gray mb-4 flex items-center gap-1">
          <i class="fa-solid fa-location-dot text-f1red"></i> <span id="hero-circuit-name">--</span>
        </p>

        <!-- Countdown Timer -->
        <div class="grid grid-cols-4 gap-2 bg-f1dark/80 p-3 rounded-lg border border-f1border text-center mb-4 backdrop-blur">
          <div>
            <div id="cd-days" class="text-lg sm:text-2xl font-bold font-f1 text-white">00</div>
            <div class="text-[10px] uppercase text-f1gray font-medium">Days</div>
          </div>
          <div>
            <div id="cd-hours" class="text-lg sm:text-2xl font-bold font-f1 text-white">00</div>
            <div class="text-[10px] uppercase text-f1gray font-medium">Hours</div>
          </div>
          <div>
            <div id="cd-mins" class="text-lg sm:text-2xl font-bold font-f1 text-white">00</div>
            <div class="text-[10px] uppercase text-f1gray font-medium">Mins</div>
          </div>
          <div>
            <div id="cd-secs" class="text-lg sm:text-2xl font-bold font-f1 text-f1red">00</div>
            <div class="text-[10px] uppercase text-f1gray font-medium">Secs</div>
          </div>
        </div>

        <!-- Session Schedule Drawer -->
        <div class="space-y-1.5 text-xs">
          <div class="text-[11px] font-semibold text-f1gray uppercase tracking-wider mb-1 flex items-center justify-between">
            <span>Weekend Sessions</span>
            <span id="hero-date-range" class="normal-case text-gray-400">---</span>
          </div>

          <div id="sessions-list" class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
            <!-- Dynamically Populated Sessions -->
            <div class="bg-f1card/60 p-2 rounded flex justify-between items-center border border-f1border/50">
              <span class="text-gray-300 font-medium">FP1</span>
              <span class="text-gray-400 font-mono text-[11px]">Loading...</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Filter Tabs & Stats -->
    <div class="px-3 pt-3 pb-2 bg-f1card/40 flex items-center justify-between border-b border-f1border">
      <div class="flex space-x-1 bg-f1dark p-1 rounded-lg border border-f1border">
        <button id="filter-all" class="tab-btn active text-xs font-medium px-2.5 py-1 rounded-md transition-all bg-f1red text-white" onclick="setFilter('all')">
          All
        </button>
        <button id="filter-upcoming" class="tab-btn text-xs font-medium px-2.5 py-1 rounded-md text-f1gray hover:text-white transition-all" onclick="setFilter('upcoming')">
          Upcoming
        </button>
        <button id="filter-completed" class="tab-btn text-xs font-medium px-2.5 py-1 rounded-md text-f1gray hover:text-white transition-all" onclick="setFilter('completed')">
          Completed
        </button>
      </div>

      <div class="text-[11px] text-f1gray">
        <span id="race-count-badge">0/0</span> Races
      </div>
    </div>

    <!-- Scrollable Race List -->
    <div id="race-list" class="divide-y divide-f1border max-h-[380px] overflow-y-auto bg-f1dark">
      <!-- Loading Placeholder -->
      <div class="p-8 text-center text-f1gray text-xs flex flex-col items-center justify-center gap-2">
        <i class="fa-solid fa-circle-notch fa-spin text-lg text-f1red"></i>
        <span>Fetching live F1 schedule...</span>
      </div>
    </div>

    <!-- Footer Status Bar -->
    <div class="p-2.5 bg-f1card border-t border-f1border text-[10px] text-f1gray flex justify-between items-center px-4">
      <div class="flex items-center gap-1.5">
        <span id="api-status-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span id="api-status-text">Ergast API Live</span>
      </div>
      <div class="italic font-f1">F1 Notion Widget</div>
    </div>

  </div>

  <script>
    // Configuration & State
    let currentSeasonRaces = [];
    let nextRaceIndex = -1;
    let timerInterval = null;
    let activeFilter = 'all'; // 'all', 'upcoming', 'completed'
    let selectedTz = 'local'; // 'local', 'track', 'utc'

    // Fallback Mock Schedule for 2026/2025 in case Ergast/Jolpi API is unreachable
    const fallbackSchedule = [
      {
        round: "1", raceName: "Australian Grand Prix", Circuit: { circuitName: "Albert Park Circuit", Location: { country: "Australia", locality: "Melbourne" } },
        date: "2026-03-15", time: "04:00:00Z",
        FirstPractice: { date: "2026-03-13", time: "01:30:00Z" },
        SecondPractice: { date: "2026-03-13", time: "05:00:00Z" },
        ThirdPractice: { date: "2026-03-14", time: "01:30:00Z" },
        Qualifying: { date: "2026-03-14", time: "05:00:00Z" }
      },
      {
        round: "2", raceName: "Chinese Grand Prix", Circuit: { circuitName: "Shanghai International Circuit", Location: { country: "China", locality: "Shanghai" } },
        date: "2026-03-22", time: "07:00:00Z",
        Sprint: { date: "2026-03-21", time: "03:00:00Z" },
        Qualifying: { date: "2026-03-21", time: "07:00:00Z" }
      },
      {
        round: "3", raceName: "Japanese Grand Prix", Circuit: { circuitName: "Suzuka International Racing Course", Location: { country: "Japan", locality: "Suzuka" } },
        date: "2026-04-05", time: "05:00:00Z",
        Qualifying: { date: "2026-04-04", time: "06:00:00Z" }
      },
      {
        round: "4", raceName: "Bahrain Grand Prix", Circuit: { circuitName: "Bahrain International Circuit", Location: { country: "Bahrain", locality: "Sakhir" } },
        date: "2026-04-12", time: "15:00:00Z",
        Qualifying: { date: "2026-04-11", time: "16:00:00Z" }
      },
      {
        round: "5", raceName: "Saudi Arabian Grand Prix", Circuit: { circuitName: "Jeddah Corniche Circuit", Location: { country: "Saudi Arabia", locality: "Jeddah" } },
        date: "2026-04-19", time: "17:00:00Z",
        Qualifying: { date: "2026-04-18", time: "17:00:00Z" }
      },
      {
        round: "6", raceName: "Miami Grand Prix", Circuit: { circuitName: "Miami International Autodrome", Location: { country: "USA", locality: "Miami" } },
        date: "2026-05-03", time: "20:00:00Z",
        Sprint: { date: "2026-05-02", time: "16:00:00Z" },
        Qualifying: { date: "2026-05-02", time: "20:00:00Z" }
      },
      {
        round: "7", raceName: "Emilia Romagna Grand Prix", Circuit: { circuitName: "Autodromo Enzo e Dino Ferrari", Location: { country: "Italy", locality: "Imola" } },
        date: "2026-05-17", time: "13:00:00Z",
        Qualifying: { date: "2026-05-16", time: "14:00:00Z" }
      },
      {
        round: "8", raceName: "Monaco Grand Prix", Circuit: { circuitName: "Circuit de Monaco", Location: { country: "Monaco", locality: "Monte Carlo" } },
        date: "2026-05-24", time: "13:00:00Z",
        Qualifying: { date: "2026-05-23", time: "14:00:00Z" }
      },
      {
        round: "9", raceName: "Spanish Grand Prix", Circuit: { circuitName: "Circuit de Barcelona-Catalunya", Location: { country: "Spain", locality: "Barcelona" } },
        date: "2026-06-07", time: "13:00:00Z",
        Qualifying: { date: "2026-06-06", time: "14:00:00Z" }
      },
      {
        round: "10", raceName: "Canadian Grand Prix", Circuit: { circuitName: "Circuit Gilles-Villeneuve", Location: { country: "Canada", locality: "Montreal" } },
        date: "2026-06-21", time: "18:00:00Z",
        Qualifying: { date: "2026-06-20", time: "20:00:00Z" }
      }
    ];

    // Country flags emoji mapping
    const countryFlags = {
      "Australia": "🇦🇺", "China": "🇨🇳", "Japan": "🇯🇵", "Bahrain": "🇧🇭", "Saudi Arabia": "🇸🇦",
      "USA": "🇺🇸", "United States": "🇺🇸", "Italy": "🇮🇹", "Monaco": "🇲🇨", "Spain": "🇪🇸",
      "Canada": "🇨🇦", "Austria": "🇦🇹", "UK": "🇬🇧", "Great Britain": "🇬🇧", "Hungary": "🇭🇺",
      "Belgium": "🇧🇪", "Netherlands": "🇳🇱", "Azerbaijan": "🇦🇿", "Singapore": "🇸🇬",
      "Mexico": "🇲🇽", "Brazil": "🇧🇷", "Las Vegas": "🇺🇸", "Qatar": "🇶🇦", "UAE": "🇦🇪", "Abu Dhabi": "🇦🇪"
    };

    // Initialize application
    document.addEventListener('DOMContentLoaded', () => {
      fetchSchedule();

      document.getElementById('refresh-btn').addEventListener('click', () => {
        fetchSchedule(true);
      });

      document.getElementById('tz-select').addEventListener('change', (e) => {
        selectedTz = e.target.value;
        renderWidget();
      });
    });

    // Fetch Schedule from API with Fallbacks
    async function fetchSchedule(forceRefresh = false) {
      const statusDot = document.getElementById('api-status-dot');
      const statusText = document.getElementById('api-status-text');

      statusDot.className = "w-1.5 h-1.5 rounded-full bg-yellow-500 animate-ping";
      statusText.textContent = "Connecting...";

      const endpoints = [
        'https://api.jolpi.ca/ergast/f1/current.json',
        'https://ergast.com/api/f1/current.json'
      ];

      let dataFetched = false;

      for (const url of endpoints) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 4000);

          const response = await fetch(url, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (!response.ok) throw new Error('API Response error');
          const data = await response.json();

          const raceData = data.MRData?.RaceTable?.Races;
          if (raceData && raceData.length > 0) {
            currentSeasonRaces = raceData;
            document.getElementById('season-year').textContent = data.MRData.RaceTable.season || '2026';
            statusDot.className = "w-1.5 h-1.5 rounded-full bg-emerald-500";
            statusText.textContent = "Live API Connected";
            dataFetched = true;
            break;
          }
        } catch (err) {
          console.warn(`Failed to fetch from ${url}:`, err);
        }
      }

      if (!dataFetched) {
        // Use Mock fallback
        currentSeasonRaces = fallbackSchedule;
        document.getElementById('season-year').textContent = '2026';
        statusDot.className = "w-1.5 h-1.5 rounded-full bg-blue-400";
        statusText.textContent = "Offline Schedule Mode";
      }

      determineNextRace();
      renderWidget();
    }

    // Identify next/current active race index
    function determineNextRace() {
      const now = new Date();
      nextRaceIndex = currentSeasonRaces.findIndex(race => {
        const raceTime = parseUTCDateTime(race.date, race.time);
        // Add 3 hours margin to consider race completed
        const raceEndTime = new Date(raceTime.getTime() + 3 * 60 * 60 * 1000);
        return raceEndTime > now;
      });

      // If all races completed, default to last race
      if (nextRaceIndex === -1 && currentSeasonRaces.length > 0) {
        nextRaceIndex = currentSeasonRaces.length - 1;
      }
    }

    // Render Hero Card and Race List
    function renderWidget() {
      if (!currentSeasonRaces.length) return;

      const nextRace = currentSeasonRaces[nextRaceIndex] || currentSeasonRaces[0];
      renderHero(nextRace);
      renderList();
    }

    // Render Hero Component with Countdown
    function renderHero(race) {
      if (!race) return;

      const flag = countryFlags[race.Circuit?.Location?.country] || '🏎️';
      document.getElementById('hero-round').textContent = race.round;
      document.getElementById('hero-country-code').textContent = (race.Circuit?.Location?.country || '').substring(0, 3).toUpperCase();
      document.getElementById('hero-title').textContent = `${flag} ${race.raceName}`;
      document.getElementById('hero-circuit-name').textContent = `${race.Circuit?.circuitName}, ${race.Circuit?.Location?.locality}`;

      // Date Range
      const mainRaceDate = parseUTCDateTime(race.date, race.time);
      document.getElementById('hero-date-range').textContent = formatDateRange(race);

      // Render Sessions
      const sessionsContainer = document.getElementById('sessions-list');
      sessionsContainer.innerHTML = '';

      const sessions = [
        { name: 'FP1', data: race.FirstPractice },
        { name: 'FP2', data: race.SecondPractice },
        { name: 'FP3', data: race.ThirdPractice },
        { name: 'Sprint', data: race.Sprint },
        { name: 'Qualifying', data: race.Qualifying },
        { name: 'Grand Prix', data: { date: race.date, time: race.time }, isMain: true }
      ].filter(s => s.data);

      sessions.forEach(s => {
        const sessionDate = parseUTCDateTime(s.data.date, s.data.time);
        const formattedTime = formatTime(sessionDate);
        const isNext = sessionDate > new Date();

        const sEl = document.createElement('div');
        sEl.className = `bg-f1card/80 p-2 rounded flex justify-between items-center border ${s.isMain ? 'border-f1red/50 bg-f1red/5' : 'border-f1border/60'}`;
        sEl.innerHTML = `
          <div class="flex items-center gap-1.5">
            <span class="font-semibold ${s.isMain ? 'text-f1red' : 'text-gray-200'}">${s.name}</span>
            ${s.isMain ? '<span class="text-[9px] bg-f1red text-white font-bold px-1 rounded">RACE</span>' : ''}
          </div>
          <span class="text-gray-300 font-mono text-[11px]">${formattedTime}</span>
        `;
        sessionsContainer.appendChild(sEl);
      });

      // Start Countdown Timer
      startCountdown(mainRaceDate);
    }

    // Render Main List
    function renderList() {
      const container = document.getElementById('race-list');
      container.innerHTML = '';

      let filteredRaces = currentSeasonRaces.filter((race, index) => {
        const isCompleted = index < nextRaceIndex;
        if (activeFilter === 'upcoming') return !isCompleted;
        if (activeFilter === 'completed') return isCompleted;
        return true;
      });

      document.getElementById('race-count-badge').textContent = `${filteredRaces.length}/${currentSeasonRaces.length}`;

      if (filteredRaces.length === 0) {
        container.innerHTML = `
          <div class="p-6 text-center text-f1gray text-xs">
            No races found for this filter.
          </div>
        `;
        return;
      }

      filteredRaces.forEach((race) => {
        const originalIndex = currentSeasonRaces.findIndex(r => r.round === race.round);
        const isNext = originalIndex === nextRaceIndex;
        const isCompleted = originalIndex < nextRaceIndex;

        const raceDate = parseUTCDateTime(race.date, race.time);
        const flag = countryFlags[race.Circuit?.Location?.country] || '🏁';

        let statusBadge = '';
        if (isNext) {
          statusBadge = `<span class="text-[10px] bg-f1red/20 text-f1red border border-f1red/40 px-2 py-0.5 rounded font-semibold animate-pulse">NEXT</span>`;
        } else if (isCompleted) {
          statusBadge = `<span class="text-[10px] bg-f1light text-f1gray px-2 py-0.5 rounded font-medium">DONE</span>`;
        } else {
          statusBadge = `<span class="text-[10px] bg-f1border text-gray-300 px-2 py-0.5 rounded font-medium">UPCOMING</span>`;
        }

        const card = document.createElement('div');
        card.className = `p-3.5 hover:bg-f1card/50 transition-colors flex items-center justify-between cursor-pointer ${isNext ? 'bg-f1card/40 border-l-4 border-l-f1red' : ''} ${isCompleted ? 'opacity-60 hover:opacity-100' : ''}`;
        
        card.onclick = () => {
          nextRaceIndex = originalIndex;
          renderWidget();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="font-f1 text-sm font-bold w-6 text-f1gray">
              R${race.round}
            </div>
            <div>
              <div class="flex items-center gap-1.5 font-semibold text-sm text-white">
                <span>${flag}</span>
                <span class="hover:text-f1red transition-colors">${race.raceName}</span>
              </div>
              <div class="text-[11px] text-f1gray flex items-center gap-2 mt-0.5">
                <span>${race.Circuit?.Location?.locality || race.Circuit?.circuitName}</span>
                <span>•</span>
                <span class="font-mono text-gray-300">${formatDateShort(raceDate)}</span>
              </div>
            </div>
          </div>

          <div class="flex flex-col items-end gap-1">
            ${statusBadge}
            <span class="text-[10px] font-mono text-f1gray">${formatTime(raceDate)}</span>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Countdown Logic
    function startCountdown(targetDate) {
      if (timerInterval) clearInterval(timerInterval);

      function update() {
        const now = new Date();
        const diff = targetDate - now;

        if (diff <= 0) {
          document.getElementById('cd-days').textContent = '00';
          document.getElementById('cd-hours').textContent = '00';
          document.getElementById('cd-mins').textContent = '00';
          document.getElementById('cd-secs').textContent = '00';
          document.getElementById('hero-badge').innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 animate-ping"></span> RACE WEEKEND / LIVE`;
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
        document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
        document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
      }

      update();
      timerInterval = setInterval(update, 1000);
    }

    // Filter switching
    function setFilter(filter) {
      activeFilter = filter;
      ['all', 'upcoming', 'completed'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (f === filter) {
          btn.className = "tab-btn text-xs font-medium px-2.5 py-1 rounded-md transition-all bg-f1red text-white";
        } else {
          btn.className = "tab-btn text-xs font-medium px-2.5 py-1 rounded-md text-f1gray hover:text-white transition-all";
        }
      });
      renderList();
    }

    // Helper functions for Date Parsing and Formatting
    function parseUTCDateTime(dateStr, timeStr) {
      if (!timeStr) timeStr = "12:00:00Z";
      const cleanTime = timeStr.endsWith('Z') ? timeStr : timeStr + 'Z';
      return new Date(`${dateStr}T${cleanTime}`);
    }

    function formatTime(dateObj) {
      if (selectedTz === 'utc') {
        return dateObj.toLocaleTimeString('en-US', { timeZone: 'UTC', hour: '2-digit', minute: '2-digit', hour12: false }) + ' UTC';
      }
      return dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function formatDateShort(dateObj) {
      return dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function formatDateRange(race) {
      const mainDate = parseUTCDateTime(race.date, race.time);
      const firstDate = race.FirstPractice ? parseUTCDateTime(race.FirstPractice.date, race.FirstPractice.time) : new Date(mainDate.getTime() - 2 * 24 * 60 * 60 * 1000);
      
      const options = { month: 'short', day: 'numeric' };
      return `${firstDate.toLocaleDateString('en-US', options)} - ${mainDate.toLocaleDateString('en-US', options)}`;
    }
  </script>
</body>
